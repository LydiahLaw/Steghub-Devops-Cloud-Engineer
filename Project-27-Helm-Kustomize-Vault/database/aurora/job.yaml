apiVersion: batch/v1
kind: Job
metadata:
  name: aurora-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mysql:8.4
          command: ["bash", "/scripts/init-aurora.sh"]
          envFrom:
            - secretRef:
                name: aurora-admin
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: schema
              mountPath: /schema
      volumes:
        - name: scripts
          configMap:
            name: aurora-init
            items:
              - key: init-aurora.sh
                path: init-aurora.sh
        - name: schema
          configMap:
            name: aurora-init
            items:
              - key: tooling-db.sql
                path: tooling-db.sql
