apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
secretGenerator:
  - name: mysql-credentials
    envs:
      - .env
configMapGenerator:
  - name: mysql-init
    files:
      - init-db.sh
      - tooling-db.sql
