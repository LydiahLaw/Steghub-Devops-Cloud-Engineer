apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-tooling
labels:
  - pairs:
      env: dev-tooling
    includeSelectors: true
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment.yaml
secretGenerator:
  - name: tooling-db-credentials
    envs:
      - db.env
