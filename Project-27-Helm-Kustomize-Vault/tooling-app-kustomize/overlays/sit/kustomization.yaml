apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sit-tooling
labels:
  - pairs:
      env: sit-tooling
    includeSelectors: true
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment.yaml
images:
  - name: tooling-app
    newName: 835960997504.dkr.ecr.us-west-1.amazonaws.com/tooling-app
    newTag: "1.0.1"
secretGenerator:
  - name: tooling-db-credentials
    envs:
      - db.env
