apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-tooling
labels:
  - pairs:
      env: prod-tooling
    includeSelectors: true
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment.yaml
images:
  - name: tooling-app
    newTag: "1.0.1"
secretGenerator:
  - name: tooling-db-credentials
    envs:
      - db.env
