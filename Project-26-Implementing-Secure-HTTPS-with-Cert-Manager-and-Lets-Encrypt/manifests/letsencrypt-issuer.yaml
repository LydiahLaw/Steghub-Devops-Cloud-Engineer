apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: lydiahngangatech@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - selector:
          dnsZones:
            - "lydiahnganga.cloud"
        dns01:
          route53:
            region: us-east-1
            role: "arn:aws:iam::835960997504:role/cert-manager-role"
            auth:
              kubernetes:
                serviceAccountRef:
                  name: "cert-manager"